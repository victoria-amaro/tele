name: Compilar APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
concurrency:
  group: amanda-apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Restaurar firma de prueba (si está configurada)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          fi
      - name: Pruebas, revisión Android y APK
        run: gradle testDebugUnitTest lintDebug assembleDebug --no-daemon
      - name: Preparar descarga
        run: cp app/build/outputs/apk/debug/app-debug.apk amanda-tv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: amanda-tv
          path: amanda-tv.apk
      - name: Publicar versión para instalar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "amanda-${{ github.run_number }}-${{ github.run_attempt }}" amanda-tv.apk --target "$GITHUB_SHA" --latest --title "Amanda ${{ github.run_number }}" --notes "Compilación de prueba. Ver README para instalación, fotos y límites."
